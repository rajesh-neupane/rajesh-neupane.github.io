<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: "Resume" }}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #111;
      max-width: 830px;
      margin: 0 auto;
      padding: 24px 28px 40px;
      font-size: 13.5px;
      line-height: 1.42;
    }
    .toolbar {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 10px;
      padding: 10px 14px; margin-bottom: 18px; font-size: 13px;
    }
    .toolbar .btn {
      display: inline-block; padding: 6px 14px; border-radius: 8px;
      background: #0f766e; color: #fff !important; text-decoration: none; font-weight: 700;
    }
    .toolbar a.link { color: #0f766e; }
    .resume h1 { font-size: 24px; margin: 0; letter-spacing: -0.01em; }
    .resume .tagline { font-size: 13.5px; color: #334155; margin: 2px 0 4px; }
    .resume .contact { font-size: 12.5px; color: #334155; margin: 0 0 10px; }
    .resume .contact a { color: #0f766e; text-decoration: none; }
    .resume h2 {
      font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
      color: #0f766e; border-bottom: 1.5px solid #0f766e;
      margin: 12px 0 6px; padding-bottom: 2px;
    }
    .resume p { margin: 4px 0; }
    .resume ul.tight { margin: 4px 0 6px; padding-left: 18px; }
    .resume ul.tight li { margin: 2px 0; }
    .resume .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .resume .where { color: #475569; font-size: 12.5px; white-space: nowrap; }
    @media print {
      .no-print { display: none !important; }
      @page { size: A4; margin: 11mm 10mm 12mm; }
      body { padding: 0; font-size: 11.5px; line-height: 1.38; max-width: none; }
      .resume h1 { font-size: 21px; }
      .resume h2 { margin: 9px 0 4px; }
      a { color: inherit; text-decoration: none; }
    }
  </style>
</head>
<body>
  <div class="toolbar no-print">
    <a class="btn" href="javascript:window.print()">🖨️ Print / Save as PDF</a>
    <span>Fits one A4 page when saved as PDF.</span>
    <a class="link" href="/">← Back to site</a>
    <a class="link" href="https://drive.google.com/file/d/17GZyArz0ziv9TkNX3xhwItb4vRQwmuN6/view" target="_blank">Extended academic CV →</a>
  </div>
  <main class="resume">
    {{ content }}
  </main>
</body>
</html>
